<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Respect integration</title><style>body{font-family:Arial,sans-serif;margin:0;color:#111827}main,footer{max-width:1000px;margin:auto;padding:32px}button{padding:12px}section{padding:24px;background:#f9fafb;border-radius:8px}img{max-width:100%}</style></head><body><main id="content"><h1>Respect your visitors’ choices.</h1><p>A browser toolkit with optional host-owned backend records.</p><section><h2>Reading sample</h2><p>Try larger text, reading aids, contrast and keyboard navigation. These controls supplement the host’s accessible design.</p><a href="#content">A sample link</a></section></main><footer><button id="accessibility">Accessibility</button> <button id="consent">Consent preferences</button><p id="sdk-status">Optional capture stopped</p></footer><div id="respect"></div><script type="module">
import {mount} from '../../dist/browser.js';
const status=document.querySelector('#sdk-status');
const toolkit=mount(document.querySelector('#respect'),{content:document.querySelector('#content'),showLauncher:'always',locale:new URLSearchParams(location.search).get('locale')??'en',namespace:'wr-example',consent:{policyVersion:'demo-1',services:[{id:'demo',category:'analytics',start:()=>{status.textContent='Optional capture started'},stop:()=>{status.textContent='Optional capture stopped'}}]},policies:{cookies:'#content',privacy:'#content',accessibility:'#content'},brand:{name:'Web Respect'},onThemeChange:dark=>document.body.style.background=dark?'#111827':'#fff'});
document.querySelector('#accessibility').onclick=()=>toolkit.open('accessibility');
document.querySelector('#consent').onclick=()=>toolkit.open('consent');
window.addEventListener('pagehide',event=>{if(!event.persisted)void toolkit.dispose();});
</script></body></html>
